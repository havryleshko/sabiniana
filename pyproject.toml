[project]
name = "sabiniana"
version = "0.0.0"
description = "Internal engine for Dental Cost Watch. Customers never see this."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabiniana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
